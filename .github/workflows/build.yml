name: Build and Export "hands made tales"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      emsdk_version:
        description: 'Select Approved Emscripten Version'
        type: choice
        required: true
        default: '5.0.7'
        options:
          - '6.0.9'
          - '5.0.7'
      talo_version:
        description: 'Talo version'
        type: choice
        required: true
        default: '1.0.0'
        options:
          - '1.0.0'
          - '0.49.0'
      gut_version:
        description: 'GUT version'
        type: choice
        required: true
        default: 'v9.6.1'
        options:
          - 'v9.6.1'
          - 'v9.7.1'
      gdmaim_version:
        description: 'GDMaim version'
        type: choice
        required: true
        default: '0.3.0'
        options:
          - '0.3.0'
          - '0.2.0'

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_TEMPLATE_DIR: "4.7.2.stable"
  SCONS_CACHE: /tmp/.scons_cache
  EMSDK_VERSION: ${{ inputs.emsdk_version || '5.0.7' }}
  TALO_VERSION: ${{ inputs.talo_version || '1.0.0' }}
  GUT_VERSION: ${{ inputs.gut_version || 'v9.6.1' }}
  GDMAIM_VERSION: ${{ inputs.gdmaim_version || '0.3.0' }}

jobs:
  build-templates:
    # TODO ubuntu-slim has a 15 minute TTL. It would not work. Self hosted runners now cost.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      # Cache check: if these specific compiled binaries already exist in cache, restore them!
      - name: Check pre-compiled template cache
        id: bin-cache
        uses: actions/cache@v6
        with:
          path: /tmp/exported-templates
          key: custom-templates-${{ env.GODOT_VERSION }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('hands_talo5.gdbuild') }}

      - name: Setup Python
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install build tools & Emscripten
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 ccache
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          pip install scons

      - name: Setup Emscripten (Web)
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: SCons intermediate cache
        if: steps.bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.SCONS_CACHE }}
          key: ${{ runner.os }}-scons-${{ env.GODOT_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('hands_talo5.gdbuild') }}
          restore-keys: |
            ${{ runner.os }}-scons-${{ env.GODOT_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-

      - name: Clone Godot engine source
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch ${{ env.GODOT_VERSION }} https://github.com/godotengine/godot.git /tmp/godot-source
          cp hands_talo5.gdbuild /tmp/godot-source/

      - name: Compile Windows template
        if: steps.bin-cache.outputs.cache-hit != 'true'
        working-directory: /tmp/godot-source
        run: |
          scons platform=windows arch=x86_64 target=template_release \
            d3d12=no winrt=no accesskit=no angle=no \
            debug_symbols=no optimize=size lto=full \
            module_text_server_adv_enabled=no module_text_server_fb_enabled=yes \
            disable_3d=yes disable_advanced_gui=yes \
            build_profile=hands_talo5.gdbuild \
            cache_path=${{ env.SCONS_CACHE }} -j$(nproc)

      - name: Compile Web template
        if: steps.bin-cache.outputs.cache-hit != 'true'
        working-directory: /tmp/godot-source
        run: |
          scons platform=web target=template_release \
            threads=yes d3d12=no debug_symbols=no optimize=size lto=full \
            module_text_server_adv_enabled=no module_text_server_fb_enabled=yes \
            disable_3d=yes dlink_enabled=yes disable_advanced_gui=yes \
            build_profile=hands_talo5.gdbuild \
            cache_path=${{ env.SCONS_CACHE }} -j$(nproc)

      # TODO: Linux, MAC and Android templates; in another script, this is slow enough.
      - name: Stage templates
        if: steps.bin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/exported-templates
          cp /tmp/godot-source/bin/godot.web.template_release.wasm32.dlink.zip /tmp/exported-templates/web_dlink_release.zip
          cp /tmp/godot-source/bin/godot.windows.template_release.x86_64.exe /tmp/exported-templates/windows_release_x86_64.exe

      - name: Upload custom templates artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-custom-templates-${{ env.GODOT_VERSION }}
          path: /tmp/exported-templates/

  export-game:
    needs: build-templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Download Godot engine editor
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      # Download the pre-built templates from prior job.
      - name: Download custom templates
        uses: actions/download-artifact@v7
        with:
          name: godot-custom-templates-${{ env.GODOT_VERSION }}
          path: /tmp/downloaded-templates

      - name: Install templates into Godot directory
        run: |
          DEST="$HOME/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATE_DIR }}"
          mkdir -p "$DEST"
          cp -r /tmp/downloaded-templates/* "$DEST/"

      - name: Get GUT addon
        run: |
          URL="https://github.com/bitwes/Gut/archive/refs/tags/${GUT_VERSION}.zip"
          mkdir -p /tmp/gut
          curl -fsSL "$URL" -o /tmp/gut/gut.zip
          unzip -q /tmp/gut/gut.zip -d /tmp/gut/
          mkdir -p addons/
          cp -r /tmp/gut/*/addons/gut addons/
          rm -rf /tmp/gut

      - name: Get GDMaim addon
        run: |
          URL="https://github.com/cherriesandmochi/gdmaim/archive/refs/tags/${GDMAIM_VERSION}.zip"
          mkdir -p /tmp/gdmaim
          curl -fsSL "$URL" -o /tmp/gdmaim/gdmaim.zip
          unzip -q /tmp/gdmaim/gdmaim.zip -d /tmp/gdmaim/
          mkdir -p addons/
          cp -r /tmp/gdmaim/*/addons/gdmaim addons/
          rm -rf /tmp/gdmaim

      - name: Setup talo addon
        run: |
          URL="https://github.com/TaloDev/godot/releases/download/${TALO_VERSION}/talo-godot-${TALO_VERSION}.zip"
          mkdir -p /tmp/talo
          curl -fsSL "$URL" -o /tmp/talo/talo.zip
          unzip -q /tmp/talo/talo.zip -d /tmp/talo/
          mkdir -p addons/
          rm -rf /tmp/talo/addons/talo/samples
          cp -r /tmp/talo/addons/talo addons/
          rm -rf /tmp/talo

      - name: Configure Talo credentials
        env:
          TALO_KEY: ${{ secrets.TALO_SECRET_KEY }}
        run: |
          if [ -n "$TALO_KEY" ]; then
            sed -i "s|YOUR_LEADERBOARD_KEY_HERE|${TALO_KEY}|g" addons/talo/settings.cfg
          fi

      - name: Run GUT Unit tests
        run: |
          godot --headless --import
          godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://test/unit -gexit

      - name: Export web
        run: |
          mkdir -p export/web
          godot --headless --export-release "Web" export/web/index.html

      - name: Export windows
        run: |
          mkdir -p export/windows
          godot --headless --export-release "Windows Desktop" export/windows/hands_made_tales.exe

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: hands-made-tales-web
          path: export/web/

      - name: Upload windows build
        uses: actions/upload-artifact@v7
        with:
          name: hands-made-tales-windows
          path: export/windows/


